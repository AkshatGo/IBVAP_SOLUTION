[pytest]
# pytest configuration for the IBVAP test suite.
# The suite uses stub detections and never loads YOLO or EasyOCR, so it
# runs in seconds on CPU with no model downloads.

testpaths = tests
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: exercises several modules together through the pipeline

addopts =
    -v
    --tb=short
    --strict-markers
