[pytest]
# pytest configuration for IBVAP tests

# Test paths
testpaths = tests

# Python path
pythonpath = .

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage
# Uncomment to enable coverage
# addopts = 
#     -v
#     --tb=short
#     --cov=src
#     --cov-report=html
#     --cov-report=term-missing

# Verbose output
verbose = 2

# Short tracebacks
tb = short

# Strict markers
strict_markers = true
